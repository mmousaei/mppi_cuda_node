# Debug and Logging
# =============================================================================

gen.add("enable_contact_debug", bool_t, 0, "Enable contact state debugging output", False)
gen.add("enable_force_debug", bool_t, 0, "Enable force computation debugging output", False)
gen.add("enable_dynamics_debug", bool_t, 0, "Enable dynamics computation debugging output", False)
gen.add("log_contact_data", bool_t, 0, "Log contact data to file", False)

exit(gen.generate(PACKAGE, "mppi_cuda_node", "HybridContactParams"))
