gen.add("enable_contact_moments", bool_t, 0, "Enable contact moment computation", True)

gen.add("contact_force_decay_rate", double_t, 0, "Rate of contact force decay when leaving contact", 0.1, 0.01, 1.0)
gen.add("contact_state_filter_cutoff", double_t, 0, "Low-pass filter cutoff for contact state (Hz)", 10.0, 1.0, 50.0)

